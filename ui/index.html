<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منصة الرؤية الحاسوبية الطبية</title>

<style>
body {
    margin: 0;
    font-family: "Tahoma", Arial, sans-serif;
    background: #eef2f5;
    color: #333;
    direction: rtl;
}

header {
    background: linear-gradient(135deg, #0066ff, #00c6ff);
    color: white;
    padding: 60px 40px;
    text-align: center;
}

header h1 {
    font-size: 44px;
    margin: 0;
}

header p {
    font-size: 18px;
    margin-top: 15px;
}

.container {
    width: 1150px;
    margin: 40px auto;
}

.section {
    background: white;
    padding: 35px;
    border-radius: 12px;
    margin-bottom: 35px;
}

.section h2 {
    margin-top: 0;
    color: #0066ff;
}

select, input, button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
}

button {
    background: #0066ff;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #004fcc;
}

.result {
    margin-top: 18px;
    font-weight: bold;
    font-size: 17px;
}

.images {
    display: flex;
    gap: 20px;
    margin-top: 25px;
}

.images img {
    width: 50%;
    border-radius: 10px;
    border: 1px solid #ccc;
    min-height: 300px;
    object-fit: contain;
    background: #fafafa;
}

footer {
    background: #222;
    color: #aaa;
    padding: 25px;
    text-align: center;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>منصة الرؤية الحاسوبية الطبية</h1>
    <p>تحليل صور الأشعة باستخدام YOLO Segmentation</p>
</header>

<div class="container">

<div class="section">
<h2>لوحة تحليل الذكاء الاصطناعي</h2>

<select id="task">
<option value="segment">تقسيم الصورة (YOLO Segmentation)</option>
</select>

<input type="file" id="file">
<button onclick="run()">تشغيل التحليل</button>

<div class="result" id="res"></div>

<div class="images">
<img id="in" alt="الصورة الأصلية">
<img id="out" alt="نتيجة التحليل">
</div>

</div>

</div>

<footer>
مشروع أكاديمي في الذكاء الاصطناعي والرؤية الحاسوبية
</footer>

<script>
async function run() {

    const fileInput = document.getElementById("file");
    const res = document.getElementById("res");
    const inImg = document.getElementById("in");
    const outImg = document.getElementById("out");

    if (!fileInput.files.length) {
        alert("الرجاء اختيار صورة أولاً");
        return;
    }

    const file = fileInput.files[0];

    // عرض الصورة الأصلية
    inImg.src = URL.createObjectURL(file);

    res.innerText = "جاري تحليل الصورة...";

    const formData = new FormData();
    formData.append("file", file);

    try {
        const response = await fetch("/segment-image", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        res.innerText = data.message;

        // مهم جداً لمنع التخزين المؤقت
        outImg.src = "/outputs/" + data.result_image + "?t=" + new Date().getTime();

    } catch (error) {
        res.innerText = "حدث خطأ أثناء التحليل";
        console.error(error);
    }
}
</script>

</body>
</html>
